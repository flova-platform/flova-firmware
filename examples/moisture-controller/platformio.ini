[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  bblanchon/ArduinoJson@6.21.5
  knolleary/PubSubClient@2.8
lib_extra_dirs =
  ../../packages
  ../../third_party
  ../../protocol/generated
build_flags =
  -I../../packages/flova-embedded-sdk/include
  -I../../packages/flova-arduino/include
  -I../../packages/flova-esp8266/include
  -DFLOVA_DATASTREAM_CAPACITY=4
  -DFLOVA_MAX_ACTIVE_DATASTREAMS_LIMIT=4
  -DFLOVA_PARAMETER_CAPACITY=3
  -DFLOVA_TEXT_CAPACITY=48
  -DFLOVA_HISTORY_CAPACITY=4
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=1
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=1
  -DFLOVA_SCHEDULE_CAPACITY=1
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=4
  -DFLOVA_ESP8266_BOUNDED_TLS_RECORDS=1
  -DFLOVA_ESP8266_TLS_TX_BYTES=512
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  -fno-exceptions
  -DFLOVA_NO_DEFAULT_BANNER
