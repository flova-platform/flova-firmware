[env:universal-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../packages
  ../../third_party
  ../../protocol/generated
build_flags =
  -I../../packages/flova-embedded-sdk/include
  -I../../packages/flova-arduino/include
  -I../../packages/flova-esp32/include
  -DFLOVA_DATASTREAM_CAPACITY=12
  -DFLOVA_TEXT_CAPACITY=96
  -DFLOVA_HISTORY_CAPACITY=32
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=8
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=8
  -DFLOVA_SCHEDULE_CAPACITY=8
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=96
  -DFLOVA_SCHEDULE_RUNTIME_ENABLED=1
  -DFLOVA_OTA_METADATA_ENABLED=1
  -DFLOVA_FIRMWARE_TARGET=\"universal_esp32\"
  -DFLOVA_OTA_BOOT_LAYOUT_VERSION=\"esp32-ab\"
