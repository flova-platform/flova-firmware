[env:universal-esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../packages
  ../../third_party
  ../../protocol/generated
build_flags =
  -I../../packages/flova-embedded-sdk/include
  -I../../packages/flova-arduino/include
  -I../../packages/flova-esp8266/include
  -DFLOVA_DATASTREAM_CAPACITY=4
  -DFLOVA_MAX_ACTIVE_DATASTREAMS_LIMIT=4
  -DFLOVA_TEXT_CAPACITY=48
  -DFLOVA_HISTORY_CAPACITY=4
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=2
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=2
  -DFLOVA_SCHEDULE_CAPACITY=2
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=16
  -DFLOVA_SCHEDULE_RUNTIME_ENABLED=1
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  -DFLOVA_ESP8266_LINK_TLS_RX_BYTES=2048
  -DFLOVA_ESP8266_OTA_TLS_RX_BYTES=16384
  -DFLOVA_ESP8266_TLS_TX_BYTES=512
  -DFLOVA_OTA_METADATA_ENABLED=1
  -DFLOVA_FIRMWARE_TARGET=\"universal_esp8266\"
  -DFLOVA_OTA_BOOT_LAYOUT_VERSION=\"esp8266-staged-copy\"
