[platformio]
default_envs = esp32-touch-led

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
lib_extra_dirs = packages
build_flags =
  -Ipackages/flova-device-sdk/include
  -Ipackages/flova-arduino/include
  -Ipackages/flova-esp32/include
  -Ipackages/flova-esp8266/include

[env:esp32-touch-led]
platform = espressif32
board = esp32dev
build_src_filter = +<../examples/esp32-touch-led/src/main.cpp>

[env:esp8266-touch-led]
platform = espressif8266
board = nodemcuv2
build_src_filter = +<../examples/esp8266-touch-led/src/main.cpp>
