[platformio]
default_envs = universal-esp32

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
lib_extra_dirs = packages
build_flags =
  -Ipackages/flova-device-sdk/include
  -Ipackages/flova-arduino/include
  -Ipackages/flova-esp32/include
  -Ipackages/flova-esp8266/include
  -DFLOVA_DATASTREAM_CAPACITY=12
  -DFLOVA_TEXT_CAPACITY=96
  -DFLOVA_HISTORY_CAPACITY=32
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=8
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=8
  -DFLOVA_SCHEDULE_CAPACITY=8
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=96
  -DFLOVA_SCHEDULE_RUNTIME_ENABLED=1

[env:universal-esp32]
platform = espressif32
board = esp32dev
build_src_filter = +<../examples/universal-esp32/src/main.cpp>

[env:universal-esp8266]
platform = espressif8266
board = nodemcuv2
monitor_speed = 74880
build_src_filter = +<../examples/universal-esp8266/src/main.cpp>

[env:esp8266-touch-test]
platform = espressif8266
board = nodemcuv2
build_src_filter = +<../examples/esp8266-touch-test/src/main.cpp>

[env:datastream-api-esp32]
platform = espressif32
board = esp32dev
build_src_filter = +<../examples/datastream-api-esp32/src/main.cpp>

[env:datastream-api-esp8266]
platform = espressif8266
board = nodemcuv2
build_src_filter = +<../examples/datastream-api-esp8266/src/main.cpp>

[env:test-esp32]
platform = espressif32
board = esp32dev
test_filter = test_datastream
build_src_filter = -<*>

[env:test-esp8266]
platform = espressif8266
board = nodemcuv2
test_filter = test_datastream
build_src_filter = -<*>
