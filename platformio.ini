[platformio]
default_envs = universal-esp32

[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = packages
  third_party
  protocol/generated
build_flags =
  -Ipackages/flova-embedded-sdk/include
  -Ipackages/flova-arduino/include
  -Ipackages/flova-esp32/include
  -Ipackages/flova-esp8266/include
  -DFLOVA_SCHEDULE_RUNTIME_ENABLED=1
  -DFLOVA_ESP8266_LINK_TLS_RX_BYTES=2048
  -DFLOVA_ESP8266_OTA_TLS_RX_BYTES=16384
  -DFLOVA_ESP8266_TLS_TX_BYTES=512
  -fno-exceptions

[esp32_profile]
build_flags =
  -DFLOVA_DATASTREAM_CAPACITY=64
  -DFLOVA_TEXT_CAPACITY=96
  -DFLOVA_HISTORY_CAPACITY=32
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=8
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=8
  -DFLOVA_SCHEDULE_CAPACITY=8
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=96
  -fstack-usage

[esp32_ble_profile]
; BLE/BTDM consumes a large fixed DRAM budget while provisioning. Keep the
; BLE universal image bounded for the ESP32 DevKit and leave SoftAP capacity
; unchanged in esp32_profile.
build_flags =
  -DFLOVA_DATASTREAM_CAPACITY=12
  -DFLOVA_TEXT_CAPACITY=64
  -DFLOVA_HISTORY_CAPACITY=8
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=4
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=4
  -DFLOVA_SCHEDULE_CAPACITY=4
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=32
  -fstack-usage

[esp8266_profile]
build_flags =
  -DFLOVA_DATASTREAM_CAPACITY=4
  -DFLOVA_MAX_ACTIVE_DATASTREAMS_LIMIT=4
  -DFLOVA_TEXT_CAPACITY=48
  -DFLOVA_HISTORY_CAPACITY=4
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=2
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=2
  -DFLOVA_SCHEDULE_CAPACITY=2
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=16

[env:universal-esp32]
platform = espressif32
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/universal-esp32/src/main.cpp>

[env:universal-esp32-ble]
platform = espressif32
board = esp32dev
board_build.partitions = no_ota.csv
build_flags =
  ${env.build_flags}
  ${esp32_ble_profile.build_flags}
build_src_filter = +<../examples/universal-esp32-ble/src/main.cpp>

[env:universal-esp8266]
platform = espressif8266
board = nodemcuv2
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  ; Keep TLS/Wi-Fi heap headroom bounded on ESP8266.
  -fstack-usage
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/universal-esp8266/src/main.cpp>

[env:esp8266-touch-test]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/esp8266-touch-test/src/main.cpp>

[env:esp32-touch-test]
platform = espressif32
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/esp32-touch-test/src/main.cpp>

[env:esp32-touch-test-ble]
platform = espressif32
board = esp32dev
board_build.partitions = no_ota.csv
build_flags =
  ${env.build_flags}
  ${esp32_ble_profile.build_flags}
build_src_filter = +<../examples/esp32-touch-test-ble/src/main.cpp>

[env:datastream-api-esp32]
platform = espressif32
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/datastream-api-esp32/src/main.cpp>

[env:datastream-api-esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/datastream-api-esp8266/src/main.cpp>

[env:custom-arduino-client-esp32]
platform = espressif32
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/custom-arduino-client/src/main.cpp> -<../examples/custom-arduino-client/src/main-esp8266.cpp>

[env:custom-arduino-client-esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/custom-arduino-client/src/main-esp8266.cpp> -<../examples/custom-arduino-client/src/main.cpp>

[env:custom-arduino-provisioning-esp32]
platform = espressif32
board = esp32dev
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
build_src_filter = +<../examples/custom-arduino-provisioning/src/main.cpp> -<../examples/custom-arduino-provisioning/src/main-esp8266.cpp>

[env:custom-arduino-provisioning-esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/custom-arduino-provisioning/src/main-esp8266.cpp> -<../examples/custom-arduino-provisioning/src/main.cpp>

[env:test-esp32]
platform = espressif32
board = esp32dev
test_filter = test_datastream
build_src_filter = -<*>
build_flags =
  ${env.build_flags}
  ${esp32_profile.build_flags}
  -DFLOVA_LINK_TEST=1

[env:test-esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  ${esp8266_profile.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  -DFLOVA_LINK_TEST=1
test_filter = test_datastream
build_src_filter = -<*>

[env:test-bootstrap-esp8266]
extends = env:test-esp8266
