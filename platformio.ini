[platformio]
default_envs = universal-esp32

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_websockets_tls.py
lib_deps =
  links2004/WebSockets@2.7.3
lib_extra_dirs = packages
  third_party
  protocol/generated
build_flags =
  -Ipackages/flova-device-sdk/include
  -Ipackages/flova-arduino/include
  -Ipackages/flova-esp32/include
  -Ipackages/flova-esp8266/include
  -DFLOVA_DATASTREAM_CAPACITY=12
  -DFLOVA_TEXT_CAPACITY=96
  -DFLOVA_HISTORY_CAPACITY=32
  -DFLOVA_COMMAND_DEDUP_CAPACITY=4
  -DFLOVA_HARDWARE_INPUT_CAPACITY=8
  -DFLOVA_HARDWARE_OUTPUT_CAPACITY=8
  -DFLOVA_SCHEDULE_CAPACITY=8
  -DFLOVA_SCHEDULE_OCCURRENCE_CAPACITY=96
  -DFLOVA_SCHEDULE_RUNTIME_ENABLED=1
  -DFLOVA_ESP8266_LINK_TLS_RX_BYTES=4096
  -DFLOVA_ESP8266_OTA_TLS_RX_BYTES=16384
  -DFLOVA_ESP8266_TLS_TX_BYTES=512

[env:universal-esp32]
platform = espressif32
board = esp32dev
build_src_filter = +<../examples/universal-esp32/src/main.cpp>

[env:universal-esp32-ab-4m]
extends = env:universal-esp32
board_build.partitions = partitions/flova-esp32-4m-ab.csv
build_flags =
  ${env.build_flags}
  -DFLOVA_ESP32_AB_OTA=1
  -DFLOVA_ESP32_AB_LAYOUT=\"esp32-4m-ab-v1\"
  -DFLOVA_ESP32_AB_MIN_SLOT_BYTES=0x1e0000

[env:universal-esp32-ab-8m]
extends = env:universal-esp32
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions/flova-esp32-8m-ab.csv
build_flags =
  ${env.build_flags}
  -DFLOVA_ESP32_AB_OTA=1
  -DFLOVA_ESP32_AB_LAYOUT=\"esp32-8m-ab-v1\"
  -DFLOVA_ESP32_AB_MIN_SLOT_BYTES=0x3e0000

[env:universal-esp8266]
platform = espressif8266
board = nodemcuv2
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -fstack-usage
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/universal-esp8266/src/main.cpp>

[env:esp8266-touch-test]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/esp8266-touch-test/src/main.cpp>

[env:datastream-api-esp32]
platform = espressif32
board = esp32dev
build_src_filter = +<../examples/datastream-api-esp32/src/main.cpp>

[env:datastream-api-esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
build_src_filter = +<../examples/datastream-api-esp8266/src/main.cpp>

[env:test-esp32]
platform = espressif32
board = esp32dev
test_filter = test_datastream
build_src_filter = -<*>
build_flags =
  ${env.build_flags}
  -DFLOVA_LINK_TEST=1

[env:test-esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  -DFLOVA_LINK_TEST=1
test_filter = test_datastream
build_src_filter = -<*>

[env:test-bootstrap-esp8266]
extends = env:test-esp8266
build_flags =
  ${env:test-esp8266.build_flags}
  -DFLOVA_BOOTSTRAP_ONLY=1
