name: Build and publish universal firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version; use auto to derive it from the SDK version and commit
        required: false
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: flova-firmware-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install PlatformIO
        run: |
          python3 -m pip install --user --disable-pip-version-check platformio==6.1.19
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          pio --version

      - name: Resolve firmware version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'auto' }}
        run: |
          base_version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' packages/flova-sdk-release/library.json | head -n 1)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid SDK version: $base_version" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_VERSION" != auto ]]; then
            version="$REQUESTED_VERSION"
          else
            suffix="ci"
            [[ "$GITHUB_EVENT_NAME" == push ]] && suffix="main"
            version="${base_version}-${suffix}-${GITHUB_SHA::12}"
          fi

          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,31}$ ]] || {
            echo "Invalid firmware version (must be 1-32 safe path characters): $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "FIRMWARE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run host and firmware validation
        env:
          PLATFORMIO_BUILD_FLAGS: -DFLOVA_FIRMWARE_VERSION=\"${{ steps.version.outputs.version }}\"
        run: |
          cmake -S . -B /tmp/flova-core-build
          cmake --build /tmp/flova-core-build
          ctest --test-dir /tmp/flova-core-build --output-on-failure
          scripts/check_flova_link_contract.sh
          scripts/check_flova_public_surface.sh
          pio run -e universal-esp32 -e universal-esp8266
          pio run -e datastream-api-esp32 -e datastream-api-esp8266
          pio test -e test-esp32 -e test-esp8266 --without-uploading --without-testing
          pio test -e test-bootstrap-esp8266 --without-uploading --without-testing
          scripts/check_esp8266_stack_usage.py
          git diff --check

      - name: Validate universal firmware artifacts
        env:
          PLATFORMIO_BUILD_FLAGS: -DFLOVA_FIRMWARE_VERSION=\"${{ steps.version.outputs.version }}\"
        run: |
          artifact_dir="$RUNNER_TEMP/flova-firmware-artifacts"
          install -m 700 -d "$artifact_dir"

          declare -A sources=(
            [universal-esp32.bin]=.pio/build/universal-esp32/firmware.bin
            [universal-esp8266.bin]=.pio/build/universal-esp8266/firmware.bin
          )
          declare -A limits=(
            [universal-esp32.bin]=1310720
            [universal-esp8266.bin]=1044464
          )

          for name in "${!sources[@]}"; do
            source="${sources[$name]}"
            destination="$artifact_dir/$name"
            test -s "$source"
            cp "$source" "$destination"
            size="$(stat -c '%s' "$destination")"
            (( size <= limits[$name] )) || {
              echo "$name exceeds OTA image limit: $size > ${limits[$name]}" >&2
              exit 1
            }
            grep -a -F -q "${{ steps.version.outputs.version }}" "$destination"
            sha256sum "$destination"
            echo "$name: $size bytes"
          done

      - name: Store firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-firmware-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/flova-firmware-artifacts/*.bin
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/firmware-${{ needs.build.outputs.version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FIRMWARE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: universal-firmware-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/flova-firmware-artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          artifact_dir="$RUNNER_TEMP/flova-firmware-artifacts"
          release_tag="firmware-$FIRMWARE_VERSION"
          notes_file="$RUNNER_TEMP/flova-firmware-release-notes.md"

          {
            echo "Universal Flova firmware $FIRMWARE_VERSION."
            echo
            for name in universal-esp32.bin universal-esp8266.bin; do
              path="$artifact_dir/$name"
              echo "- $name: $(stat -c '%s' "$path") bytes, SHA-256 $(sha256sum "$path" | cut -d' ' -f1)"
            done
          } > "$notes_file"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$artifact_dir"/*.bin --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_flags=()
            [[ "$FIRMWARE_VERSION" == *-* ]] && release_flags+=(--prerelease)
            gh release create "$release_tag" \
              "$artifact_dir/universal-esp32.bin" \
              "$artifact_dir/universal-esp8266.bin" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Universal firmware $FIRMWARE_VERSION" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          fi

          release_url="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          for name in universal-esp32.bin universal-esp8266.bin; do
            path="$artifact_dir/$name"
            url="$release_url/download/$release_tag/$name"
            curl --fail --silent --show-error --location --head --max-time 20 "$url"
            {
              echo "## $name"
              echo
              echo "- Version: $FIRMWARE_VERSION"
              echo "- SHA-256: \\`$(sha256sum "$path" | cut -d' ' -f1)\\`"
              echo "- Size: $(stat -c '%s' "$path") bytes"
              echo "- Download: [$name]($url)"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
