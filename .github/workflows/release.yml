name: Build and publish FlovaSDK

on:
  push:
    branches: [main]
    tags: ['sdk-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flova-sdk-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install CI tools
        run: |
          command -v rg >/dev/null || {
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          }

      - name: Install PlatformIO
        run: |
          python3 -m pip install --user --disable-pip-version-check platformio==6.1.19
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          pio --version

      - name: Resolve SDK version
        id: version
        run: |
          version="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",/\1/p' packages/flova-sdk-release/library.json | head -n 1)"
          properties_version="$(sed -n 's/^version=//p' packages/flova-sdk-release/library.properties)"
          [ -n "$version" ] && [ "$version" = "$properties_version" ] || {
            echo "SDK manifest versions do not match" >&2
            exit 1
          }

          if [[ "$GITHUB_REF" == refs/tags/sdk-v* ]]; then
            tag_version="${GITHUB_REF_NAME#sdk-v}"
            [ "$tag_version" = "$version" ] || {
              echo "sdk tag $tag_version does not match package version $version" >&2
              exit 1
            }
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SDK_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run repository validation
        run: |
          cmake -S . -B /tmp/flova-core-build
          cmake --build /tmp/flova-core-build
          ctest --test-dir /tmp/flova-core-build --output-on-failure
          sh scripts/check_flova_version.sh
          scripts/check_flova_link_contract.sh
          scripts/check_flova_public_surface.sh
          pio run -e universal-esp32 -e universal-esp8266
          pio run -e datastream-api-esp32 -e datastream-api-esp8266
          pio test -e test-esp32 -e test-esp8266 --without-uploading --without-testing
          pio test -e test-bootstrap-esp8266 --without-uploading --without-testing
          python3 scripts/check_flova_memory.py universal-esp32 universal-esp8266
          scripts/check_esp8266_stack_usage.py
          git diff --check

      - name: Validate exported SDK package
        run: |
          scripts/check_sdk_release.sh "$RUNNER_TEMP/flova-sdk-check"

      - name: Store SDK package
        uses: actions/upload-artifact@v4
        with:
          name: flova-sdk-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/flova-sdk-check/FlovaSDK.tar.gz
          if-no-files-found: error
          retention-days: 14

  arduino:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: esp32:esp32:esp32
            platform: esp32:esp32
            version: 2.0.17
            url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketch: packages/flova-sdk-release/examples/Basic
          - fqbn: esp8266:esp8266:generic:mmu=4816H
            platform: esp8266:esp8266
            version: 3.1.2
            url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            sketch: packages/flova-sdk-release/examples/UniversalESP8266
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download SDK package
        uses: actions/download-artifact@v4
        with:
          name: flova-sdk-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/flova-sdk-artifact

      - name: Extract SDK package
        run: |
          mkdir -p "$RUNNER_TEMP/FlovaSDK"
          tar -xzf "$RUNNER_TEMP/flova-sdk-artifact/FlovaSDK.tar.gz" -C "$RUNNER_TEMP/FlovaSDK"

      - name: Compile Arduino example
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: ${{ matrix.platform }}
              version: ${{ matrix.version }}
              source-url: ${{ matrix.url }}
          libraries: |
            - source-path: ${{ runner.temp }}/FlovaSDK
          sketch-paths: |
            - ${{ matrix.sketch }}

  publish:
    needs: [validate, arduino]
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SDK_VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Install PlatformIO
        run: |
          python3 -m pip install --user --disable-pip-version-check platformio==6.1.19
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          pio --version

      - name: Download SDK package
        uses: actions/download-artifact@v4
        with:
          name: flova-sdk-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/flova-sdk-artifact

      - name: Publish PlatformIO package
        run: |
          if pio pkg show "flova-platform/FlovaSDK@$SDK_VERSION" >/dev/null 2>&1; then
            echo "PlatformIO package already published: $SDK_VERSION"
          else
            test -n "$PLATFORMIO_AUTH_TOKEN"
            pio pkg publish "$RUNNER_TEMP/flova-sdk-artifact/FlovaSDK.tar.gz" \
              --owner flova-platform --no-interactive
          fi

      - name: Publish Arduino Library Manager tree
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          generated_tag="v$SDK_VERSION"
          library_dir="$RUNNER_TEMP/library-release"
          archive="$RUNNER_TEMP/flova-sdk-artifact/FlovaSDK.tar.gz"

          if git ls-remote --exit-code "$repo_url" "refs/tags/$generated_tag" >/dev/null 2>&1; then
            echo "Arduino tag already published: $generated_tag"
            exit 0
          fi

          if git ls-remote --exit-code "$repo_url" refs/heads/library-release >/dev/null 2>&1; then
            git clone --branch library-release --single-branch "$repo_url" "$library_dir"
          else
            git clone --no-checkout "$repo_url" "$library_dir"
            git -C "$library_dir" checkout --orphan library-release
          fi

          git -C "$library_dir" rm -rf . || true
          tar -xzf "$archive" -C "$library_dir"
          git -C "$library_dir" config user.name "github-actions[bot]"
          git -C "$library_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$library_dir" add -A
          if git -C "$library_dir" diff --cached --quiet; then
            echo "library-release already contains FlovaSDK $SDK_VERSION"
          else
            git -C "$library_dir" commit -m "release: FlovaSDK $SDK_VERSION"
            git -C "$library_dir" push origin HEAD:library-release
          fi
          git -C "$library_dir" tag -a "$generated_tag" -m "FlovaSDK $SDK_VERSION"
          git -C "$library_dir" push origin "$generated_tag"

          test "$(git -C "$library_dir" show "$generated_tag:library.json" | sed -n 's/^[[:space:]]*"version": "\([^"]*\)",/\1/p' | head -n 1)" = "$SDK_VERSION"

      - name: Publish GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists: $GITHUB_REF_NAME"
          else
            cp "$RUNNER_TEMP/flova-sdk-artifact/FlovaSDK.tar.gz" "$RUNNER_TEMP/FlovaSDK-$SDK_VERSION.tar.gz"
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/FlovaSDK-$SDK_VERSION.tar.gz" \
              --title "FlovaSDK $SDK_VERSION" --notes-file packages/flova-sdk-release/RELEASE_NOTES.md
          fi
