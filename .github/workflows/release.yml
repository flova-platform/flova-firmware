name: Build and publish universal firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version; use auto to derive it from the SDK version and commit
        required: false
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: flova-firmware-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install PlatformIO
        run: |
          python3 -m pip install --user --disable-pip-version-check platformio==6.1.19
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          pio --version

      - name: Resolve firmware version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'auto' }}
        run: |
          base_version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' packages/flova-sdk-release/library.json | head -n 1)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid SDK version: $base_version" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_VERSION" != auto ]]; then
            version="$REQUESTED_VERSION"
          else
            suffix="ci"
            [[ "$GITHUB_EVENT_NAME" == push ]] && suffix="main"
            version="${base_version}-${suffix}-${GITHUB_SHA::12}"
          fi

          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,31}$ ]] || {
            echo "Invalid firmware version (must be 1-32 safe path characters): $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "FIRMWARE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run host and firmware validation
        env:
          PLATFORMIO_BUILD_FLAGS: -DFLOVA_FIRMWARE_VERSION=\"${{ steps.version.outputs.version }}\"
        run: |
          cmake -S . -B /tmp/flova-core-build
          cmake --build /tmp/flova-core-build
          ctest --test-dir /tmp/flova-core-build --output-on-failure
          scripts/check_flova_link_contract.sh
          scripts/check_flova_public_surface.sh
          pio run -e universal-esp32 -e universal-esp8266
          pio run -e datastream-api-esp32 -e datastream-api-esp8266
          pio test -e test-esp32 -e test-esp8266 --without-uploading --without-testing
          pio test -e test-bootstrap-esp8266 --without-uploading --without-testing
          scripts/check_esp8266_stack_usage.py
          git diff --check

      - name: Validate universal firmware artifacts
        env:
          PLATFORMIO_BUILD_FLAGS: -DFLOVA_FIRMWARE_VERSION=\"${{ steps.version.outputs.version }}\"
        run: |
          artifact_dir="$RUNNER_TEMP/flova-firmware-artifacts"
          install -m 700 -d "$artifact_dir"

          declare -A sources=(
            [universal-esp32.bin]=.pio/build/universal-esp32/firmware.bin
            [universal-esp8266.bin]=.pio/build/universal-esp8266/firmware.bin
          )
          declare -A limits=(
            [universal-esp32.bin]=1310720
            [universal-esp8266.bin]=1044464
          )

          for name in "${!sources[@]}"; do
            source="${sources[$name]}"
            destination="$artifact_dir/$name"
            test -s "$source"
            cp "$source" "$destination"
            size="$(stat -c '%s' "$destination")"
            (( size <= limits[$name] )) || {
              echo "$name exceeds OTA image limit: $size > ${limits[$name]}" >&2
              exit 1
            }
            grep -a -F -q "${{ steps.version.outputs.version }}" "$destination"
            sha256sum "$destination"
            echo "$name: $size bytes"
          done

      - name: Store firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-firmware-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/flova-firmware-artifacts/*.bin
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://storage.flova.ir/flova-assets/releases/firmware/${{ needs.build.outputs.version }}/
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      FIRMWARE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: universal-firmware-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/flova-firmware-artifacts

      - name: Prepare SSH
        run: |
          install -m 700 -d "$RUNNER_TEMP/flova-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/flova-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/flova-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/flova-ssh/id_ed25519" "$RUNNER_TEMP/flova-ssh/known_hosts"
          test -s "$RUNNER_TEMP/flova-ssh/known_hosts"

      - name: Verify VPS uploader
        run: |
          ssh_args=(-i "$RUNNER_TEMP/flova-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/flova-ssh/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" \
            "test -x /opt/flova/infra/scripts/upload-release-artifact.sh && grep -q 'content_type=' /opt/flova/infra/scripts/upload-release-artifact.sh && grep -q 'releases/firmware' /opt/flova/infra/scripts/configure-object-storage.sh"

      - name: Upload firmware to RustFS
        run: |
          ssh_args=(-i "$RUNNER_TEMP/flova-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/flova-ssh/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote_dir="/tmp/flova-firmware-${GITHUB_RUN_ID}"
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$remote_dir'"
          cleanup() {
            ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "rm -rf -- '$remote_dir'" || true
          }
          trap cleanup EXIT

          for name in universal-esp32.bin universal-esp8266.bin; do
            local_path="$RUNNER_TEMP/flova-firmware-artifacts/$name"
            remote_path="$remote_dir/$name"
            object_key="releases/firmware/$FIRMWARE_VERSION/$name"
            test -s "$local_path"
            scp "${ssh_args[@]}" "$local_path" "$VPS_USER@$VPS_HOST:$remote_path"
            url="$(ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" \
              "FLOVA_INFRA_ENV_FILE=/opt/flova/infra/.env.production sh /opt/flova/infra/scripts/upload-release-artifact.sh '$remote_path' '$object_key' application/octet-stream")"
            curl --fail --silent --show-error --location --head --max-time 20 "$url"
            {
              echo "## $name"
              echo
              echo "- Version: $FIRMWARE_VERSION"
              echo "- SHA-256: \\`$(sha256sum "$local_path" | cut -d' ' -f1)\\`"
              echo "- Size: $(stat -c '%s' "$local_path") bytes"
              echo "- Download: [$name]($url)"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - if: always()
        run: rm -f "$RUNNER_TEMP/flova-ssh/id_ed25519" "$RUNNER_TEMP/flova-ssh/known_hosts"
